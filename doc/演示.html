<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>锚点机制示意图</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
  background: #0d0d0d;
  color: #e5e5e5;
  display: flex;
  justify-content: center;
  padding: 20px;
  min-height: 100vh;
}
.container { max-width: 820px; width: 100%; }
h1 { font-size: 22px; text-align: center; margin-bottom: 8px; color: #fff; }
.sub { font-size: 14px; text-align: center; color: #999; margin-bottom: 28px; }
.scene { margin-bottom: 32px; }
.scene-title {
  font-size: 16px; font-weight: 600; margin-bottom: 12px;
  padding: 8px 16px; border-radius: 8px; display: inline-block;
}
.scene-good .scene-title { background: rgba(29,201,129,0.15); color: #1DC981; }
.scene-bad .scene-title { background: rgba(232,70,58,0.15); color: #E8463A; }
svg { width: 100%; height: auto; border-radius: 12px; background: #1a1a1a; }
.legend {
  display: flex; flex-wrap: wrap; gap: 16px; margin-top: 24px;
  padding: 16px; background: #1a1a1a; border-radius: 12px; font-size: 13px;
}
.legend-item { display: flex; align-items: center; gap: 8px; }
.swatch { width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0; }
.note { font-size: 13px; color: #999; line-height: 1.6; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <h1>锚点机制示意图</h1>
  <p class="sub">对比"有锚点"与"无锚点"在灾害力下的不同结果</p>

  <!-- 画面1：有锚点 -->
  <div class="scene scene-good">
    <div class="scene-title">✓ 有锚点 · 结构稳住，核心物安全</div>
    <svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grd1" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
          <rect width="12" height="12" fill="#262626"/>
          <line x1="0" y1="0" x2="0" y2="12" stroke="#444" stroke-width="1"/>
        </pattern>
        <marker id="fa1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M0 0 L10 5 L0 10 Z" fill="#EFAA17"/>
        </marker>
      </defs>

      <!-- 标签 -->
      <text x="40" y="30" fill="#999" font-size="13">灾害力从左侧推来</text>

      <!-- 灾害力箭头 -->
      <path d="M80 100 L240 100" stroke="#EFAA17" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#fa1)"/>
      <text x="160" y="90" text-anchor="middle" fill="#EFAA17" font-size="13" font-weight="600">风力 / 冲击</text>

      <!-- 基岩 -->
      <rect x="40" y="200" width="640" height="28" fill="url(#grd1)"/>
      <line x1="40" y1="200" x2="680" y2="200" stroke="#555" stroke-width="2"/>
      <text x="60" y="247" fill="#777" font-size="12">基岩 / 地面</text>

      <!-- 结构（站立不倒） -->
      <!-- 左柱 -->
      <rect x="320" y="120" width="28" height="80" fill="#2a2a2a" stroke="#888" stroke-width="2"/>
      <!-- 右柱 -->
      <rect x="412" y="120" width="28" height="80" fill="#2a2a2a" stroke="#888" stroke-width="2"/>
      <!-- 横梁 -->
      <rect x="315" y="100" width="130" height="20" fill="#2a2a2a" stroke="#888" stroke-width="2"/>
      <!-- 斜撑 -->
      <polygon points="345,100 385,100 345,120" fill="#2a2a2a" stroke="#888" stroke-width="2"/>

      <!-- 关节点 -->
      <circle cx="334" cy="120" r="4" fill="#999"/>
      <circle cx="426" cy="120" r="4" fill="#999"/>
      <circle cx="345" cy="120" r="4" fill="#999"/>
      <circle cx="380" cy="100" r="4" fill="#999"/>

      <!-- 核心物 -->
      <circle cx="375" cy="82" r="14" fill="#F87454" stroke="#ff9a80" stroke-width="2"/>
      <text x="375" y="86" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">核心</text>

      <!-- 锚点（柱底钉入基岩） -->
      <line x1="334" y1="200" x2="334" y2="225" stroke="#6054F1" stroke-width="5" stroke-linecap="round"/>
      <polygon points="327,225 341,225 334,237" fill="#6054F1"/>
      <line x1="426" y1="200" x2="426" y2="225" stroke="#6054F1" stroke-width="5" stroke-linecap="round"/>
      <polygon points="419,225 433,225 426,237" fill="#6054F1"/>

      <!-- 标注线 -->
      <line x1="334" y1="237" x2="250" y2="160" stroke="#6054F1" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="245" y="156" text-anchor="end" fill="#6054F1" font-size="12" font-weight="600">锚点（钉入基岩）</text>
      <text x="245" y="170" text-anchor="end" fill="#6054F1" font-size="11">极牢固，抗拉拔</text>

      <line x1="380" y1="100" x2="520" y2="80" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="525" y="76" fill="#999" font-size="12">普通关节（可断裂）</text>
      <text x="525" y="90" fill="#777" font-size="11">Break Force 达到阈值会断</text>

      <line x1="365" y1="110" x2="520" y2="140" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="525" y="136" fill="#999" font-size="12">三角形斜撑</text>
      <text x="525" y="150" fill="#777" font-size="11">抗侧向力，工程常识</text>

      <line x1="375" y1="82" x2="250" y2="55" stroke="#F87454" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="245" y="50" text-anchor="end" fill="#F87454" font-size="12" font-weight="600">核心物（保护目标）</text>

      <!-- 结果标注 -->
      <text x="600" y="260" fill="#1DC981" font-size="13" font-weight="600">✓ 力传导到锚点，结构不倒</text>
    </svg>
  </div>

  <!-- 画面2：无锚点 -->
  <div class="scene scene-bad">
    <div class="scene-title">✗ 无锚点 · 整体被推走，核心物掉落</div>
    <svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grd2" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
          <rect width="12" height="12" fill="#262626"/>
          <line x1="0" y1="0" x2="0" y2="12" stroke="#444" stroke-width="1"/>
        </pattern>
        <marker id="fa2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M0 0 L10 5 L0 10 Z" fill="#EFAA17"/>
        </marker>
      </defs>

      <text x="40" y="30" fill="#999" font-size="13">同样的力，但底部没有锚</text>

      <!-- 灾害力箭头 -->
      <path d="M80 120 L240 120" stroke="#EFAA17" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#fa2)"/>
      <text x="160" y="110" text-anchor="middle" fill="#EFAA17" font-size="13" font-weight="600">风力 / 冲击</text>

      <!-- 基岩 -->
      <rect x="40" y="240" width="640" height="28" fill="url(#grd2)"/>
      <line x1="40" y1="240" x2="680" y2="240" stroke="#555" stroke-width="2"/>
      <text x="60" y="287" fill="#777" font-size="12">基岩 / 地面</text>

      <!-- 倾倒结构（整体右移 + 倾斜） -->
      <g transform="translate(70 0) rotate(20 360 240)">
        <rect x="320" y="160" width="28" height="80" fill="#2a2a2a" stroke="#888" stroke-width="2"/>
        <rect x="412" y="160" width="28" height="80" fill="#2a2a2a" stroke="#888" stroke-width="2"/>
        <rect x="315" y="140" width="130" height="20" fill="#2a2a2a" stroke="#888" stroke-width="2"/>
        <polygon points="345,140 385,140 345,160" fill="#2a2a2a" stroke="#888" stroke-width="2"/>
        <circle cx="334" cy="160" r="4" fill="#999"/>
        <circle cx="426" cy="160" r="4" fill="#999"/>
      </g>

      <!-- 核心物滚落 -->
      <circle cx="560" cy="225" r="14" fill="#F87454" stroke="#ff9a80" stroke-width="2"/>
      <path d="M480 200 Q520 195 555 215" stroke="#F87454" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
      <text x="600" y="220" fill="#F87454" font-size="12" font-weight="600">核心物掉落！</text>

      <!-- 标注 -->
      <line x1="400" y1="240" x2="280" y2="215" stroke="#E8463A" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="275" y="212" text-anchor="end" fill="#E8463A" font-size="12" font-weight="600">底部无锚</text>
      <text x="275" y="226" text-anchor="end" fill="#999" font-size="11">结构整体滑动</text>

      <line x1="450" y1="170" x2="530" y2="150" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="535" y="146" fill="#999" font-size="12">关节没断，但没用</text>
      <text x="535" y="160" fill="#777" font-size="11">整体被力推走了</text>

      <text x="600" y="275" fill="#E8463A" font-size="13" font-weight="600">✗ 关卡失败</text>
    </svg>
  </div>

  <!-- 图例 -->
  <div class="legend">
    <div class="legend-item"><div class="swatch" style="background:#2a2a2a;border:1px solid #888"></div>结构部件（矩形/三角）</div>
    <div class="legend-item"><div class="swatch" style="background:#6054F1"></div>锚点（钉入基岩）</div>
    <div class="legend-item"><div class="swatch" style="background:#999;border-radius:50%"></div>普通关节</div>
    <div class="legend-item"><div class="swatch" style="background:#F87454;border-radius:50%"></div>核心物</div>
    <div class="legend-item"><div class="swatch" style="background:#EFAA17"></div>灾害力</div>
  </div>

  <p class="note">
    核心机制：锚点把结构和基岩"钉死"。没有锚，整个结构会被灾害力推走；有锚，力传导到锚点，结构稳住。
    玩家的策略是决定"锚放几个、放哪里"——锚太少结构会跑，锚位置不对结构会从锚点之间撕裂。
  </p>
</div>
</body>
</html>
